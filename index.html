<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chattywampus</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="login-screen">
    <div class="login-box">
        <h1>Chattywampus</h1>
        <input id="username" placeholder="Display name">
        <button id="join">Join Chat</button>
    </div>
</div>


<header>
    <h2>Chattywampus</h2>
    <span id="status">Connecting...</span>
</header>


<div id="chat"></div>


<div id="controls">

    <input 
        id="message"
        placeholder="Type a message..."
    >

    <input 
        id="file"
        type="file"
        accept="image/*,video/*,audio/*,.pdf,.txt,.zip"
    >

    <button id="send">
        Send
    </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
